# Local Supabase stack for development (`supabase start`, `supabase db reset`).
# Never `supabase link` or `supabase db push` from this repository without the owner (docs/DEPLOYMENT-RUNBOOK.md).
project_id = "soledrop"

[api]
enabled = true
port = 54321
# The storefront talks to the database only from the server with the service role; the browser
# gets no direct table access (RLS denies anon by default), so only these schemas are exposed.
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
# Shopper accounts live in public.customers (server/customers); Supabase Auth is reserved for staff (phase 2).
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = true

[storage]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
